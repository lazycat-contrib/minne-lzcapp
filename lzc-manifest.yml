lzc-sdk-version: "0.1"
name: Minne
package: cloud.lazycat.app.minne
version: 0.2.7
min_os_version: 1.3.8
description: "A Graph-Powered Personal Knowledge Base with SurrealDB and AI integration"
license: MIT
homepage: https://github.com/perstarkse/minne
author: perstarkse

application:
  subdomain: minne
  routes:
    - /=http://minne:3000

services:
  surrealdb:
    # surrealdb/surrealdb:latest
    image: registry.lazycat.cloud/czyt/surrealdb/surrealdb:05d840597db19b83
    user: root
    environment:
      - SURREALDB_USERNAME=lazycat
      - SURREALDB_PASSWORD=lazycat
      - SURREALDB_DATABASE=minne
      - SURREALDB_NAMESPACE=minne
    command: start --log info --user lazycat --pass lazycat rocksdb:/database/database.db
    binds:
      - /lzcapp/var/database:/database

  minne:
    # ghcr.io/perstarkse/minne:v0.2.7
    image: registry.lazycat.cloud/czyt/perstarkse/minne:01aba4a9081aef34
    environment:
      - SURREALDB_ADDRESS=ws://surrealdb:8000
      - SURREALDB_USERNAME=lazycat
      - SURREALDB_PASSWORD=lazycat
      - SURREALDB_DATABASE=minne
      - SURREALDB_NAMESPACE=minne
      - OPENAI_BASE_URL={{.U.open_ai_base_url}}
      - OPENAI_API_KEY={{.U.openai_api_key}}
      - DATA_DIR=/data
      - HTTP_PORT=3000
      - RUST_LOG=info
      - RERANKING_ENABLED={{.U.reranking_enabled}}
    command: sh -c 'echo "Waiting for SurrealDB to start..." && sleep 10 && echo "Starting application..." && /usr/local/bin/main'
    binds:
      - /lzcapp/var/data:/data
    depends_on:
      - surrealdb

locales:
  en:
    name: "Minne"
    description: "A Graph-Powered Personal Knowledge Base with SurrealDB and AI integration"
  zh:
    name: "Minne"
    description: "基于 SurrealDB 和 AI 集成的图谱驱动个人知识库系统"
